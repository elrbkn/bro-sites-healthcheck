name: Site Health Check

on:
   schedule:
    # UTC-время. Соответствует ≈03:00 / 11:00 / 19:00 по Europe/Riga
    - cron: "0 0,8,16 * * *"
  workflow_dispatch: {}

permissions:
  contents: write   # нужно, чтобы закоммитить обновлённый state/last-status.json обратно

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: site-healthcheck   # не даёт двум прогонам пересечься и одновременно пушить state
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npx playwright install --with-deps chromium

      - name: Run health check
        run: npm start
        env:
          SOAX_HOST: ${{ secrets.SOAX_HOST }}
          SOAX_PORT: ${{ secrets.SOAX_PORT }}
          SOAX_LOGIN_PREFIX: ${{ secrets.SOAX_LOGIN_PREFIX }}
          SOAX_LOGIN_SUFFIX: ${{ secrets.SOAX_LOGIN_SUFFIX }}
          SOAX_PASSWORD: ${{ secrets.SOAX_PASSWORD }}
          PROXY_COUNTRY: de
          PROXY_ROTATE_SESSION: "true"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DAILY_SUMMARY_HOUR: "11"
          REPORT_TIMEZONE: "Europe/Riga"

      - name: Commit updated state
        if: always()   # даже если health check нашёл ошибки (exit code 1) — state всё равно нужно сохранить
        run: |
          git config user.name "healthcheck-bot"
          git config user.email "healthcheck-bot@users.noreply.github.com"
          git add state/last-status.json
          git diff --cached --quiet || git commit -m "chore: update health-check state [skip ci]"
          git push